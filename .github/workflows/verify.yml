name: Verify AOT cache patch

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-2022
            platform: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Download the supported JBR SDK
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            'https://cache-redirector.jetbrains.com/intellij-jbr/jbrsdk-25.0.4.1-${{ matrix.platform }}-x64-b635.70.tar.gz' \
            --output "$RUNNER_TEMP/jbr.tar.gz"
          mkdir "$RUNNER_TEMP/aot-jbr"
          tar --force-local -xzf "$RUNNER_TEMP/jbr.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/aot-jbr"
      - name: Verify the original launcher with modified JAR timestamps
        shell: bash
        run: python tests/test_image.py --jdk "$RUNNER_TEMP/aot-jbr"
