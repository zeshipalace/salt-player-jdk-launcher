name: Verify AOT cache patch

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-2022
            platform: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Verify with the supported JBR SDK
        shell: python
        env:
          JBR_PLATFORM: ${{ matrix.platform }}
        run: |
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tarfile
          import urllib.request

          temporary = Path(os.environ['RUNNER_TEMP'])
          platform = os.environ['JBR_PLATFORM']
          url = f'https://cache-redirector.jetbrains.com/intellij-jbr/jbrsdk-25.0.4.1-{platform}-x64-b635.70.tar.gz'
          archive_path = temporary / 'aot-jbr.tar.gz'
          urllib.request.urlretrieve(url, archive_path)
          with tarfile.open(archive_path) as archive:
              archive.extractall(temporary / 'aot-jbr', filter='data')
          homes = list((temporary / 'aot-jbr').glob('*/release'))
          assert len(homes) == 1, homes
          subprocess.run([sys.executable, 'tests/test_image.py', '--jdk', str(homes[0].parent)], check=True)
